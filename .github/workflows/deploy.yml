# Deploy the redirect that line-calc.stoatworks-labs.com has been since 2026-10-11,
# when Line Calc moved into Pixel Peeker as its Line calc view. There is nothing to
# build: wrangler deploys worker/redirect.js on its own (see wrangler.toml), and the
# check at the end proves the hostname answers 301 to the right place. The original
# build-and-serve steps are in this file's history.
#
# Here from the first commit, so this repo never goes through the phase the rest of
# the fleet did, where a tool shipped only when somebody remembered to run
# `cf-run npx wrangler deploy` from a laptop.
#
# Deliberately the same shape as the rest of the fleet's deploy.yml, so a fix to
# one is obvious in the others. See negative-space for the original.

name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/dependabot.yml"
  workflow_dispatch:

# Newest push wins. Cancelling an in-flight build is safe: wrangler uploads the
# assets first and activates the version as one step at the end, so a run killed
# part way through never becomes the live version.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Fail in a second rather than after a build. A deploy that cannot
      # authenticate is the whole point of this job failing to happen.
      - name: Check the Cloudflare token is present
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set on this repository, so the"
            echo "::error::site cannot be deployed. Create a Cloudflare API token with"
            echo "::error::the 'Edit Cloudflare Workers' template scoped to this account,"
            echo "::error::then:"
            echo "::error::  gh secret set CLOUDFLARE_API_TOKEN --repo stoatworks-labs/line-calc"
            echo "::error::cf-run already uses such a token from the login keychain under"
            echo "::error::the service name 'stoatworks-cloudflare'; the same one works here."
            exit 1
          fi
          echo "token present - ok"

      # wrangler is pinned rather than left to resolve to latest: an unpinned npx
      # would let a wrangler major change how deploys behave on a morning nobody
      # touched this repo. Dependabot's github-actions ecosystem only bumps `uses:`
      # refs, never a version inside a `run:`, so bump this deliberately.
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.116.0 deploy

      # Prove it actually landed, against the domain a visitor uses: a 301 to Pixel
      # Peeker's Line calc view. The query string is a cache-buster, so an edge or a
      # proxy holding the old page cannot make this pass or fail on stale content.
      - name: Check the live site redirects to Pixel Peeker
        run: |
          set -euo pipefail
          want="https://pixel-peeker.stoatworks-labs.com/#line"
          for attempt in 1 2 3 4 5; do
            headers=$(curl -sS -I --max-time 30 \
                      "https://line-calc.stoatworks-labs.com/?cb=${GITHUB_RUN_ID}-${attempt}" \
                      | tr -d '\r' || true)
            status=$(printf '%s\n' "$headers" | awk 'NR==1 {print $2}')
            location=$(printf '%s\n' "$headers" | awk 'tolower($1) == "location:" {print $2}')
            if [ "$status" = "301" ] && [ "$location" = "$want" ]; then
              echo "live site redirects to $want (attempt $attempt)"
              exit 0
            fi
            echo "not there yet: status '$status', location '$location' — retrying in 10s (attempt $attempt)"
            sleep 10
          done
          echo "::error::Deployed, but https://line-calc.stoatworks-labs.com/ does not answer"
          echo "::error::301 -> $want. Check the Worker's routes, and that line-calc is what the"
          echo "::error::custom domain actually points at."
          exit 1
