<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Line Calc — LED panels per processor port and per power circuit</title>
    <meta
      name="description"
      content="How many LED panels fit on one processor port, and how many on one power circuit. A library of 150 real rental panels with their datasheet power figures, or define your own."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d1b2a'/%3E%3Crect x='5' y='7' width='22' height='7' rx='1' fill='%234cc9f0' opacity='0.9'/%3E%3Crect x='5' y='18' width='14' height='7' rx='1' fill='%23f9a03f' opacity='0.9'/%3E%3C/svg%3E" />
    <link rel="canonical" href="https://line-calc.stoatworks-labs.com/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Stoatworks Labs">
    <meta property="og:locale" content="en_GB">
    <meta property="og:url" content="https://line-calc.stoatworks-labs.com/">
    <meta property="og:title" content="Line Calc — LED panels per processor port and per power circuit">
    <meta property="og:description" content="How many LED panels fit on one processor port, and how many on one power circuit. A library of 150 real rental panels with their datasheet power figures, or define your own.">
    <!-- Card hosted on the main site: it is regenerated in place by the website's
         make_thumbnails.py and keeps its filename, so a copy vendored here would go
         stale without anything saying so. -->
    <meta property="og:image" content="https://stoatworks-labs.com/thumbs/line-calc.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1280">
    <meta property="og:image:height" content="720">
    <meta property="og:image:alt" content="Line Calc — LED panels per processor port and per power circuit">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://stoatworks-labs.com/thumbs/line-calc.png">
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest's icons and wants a PNG of its own. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d1b2a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1b2a" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      About dialog. Both files are vendored from stoatworks-backend/about and
      generated by its sync-about.py — edit them there, never here. Classic +
      defer like the support footer: about-data.js only sets defaults, so it and
      the app's own startup can load in either order.
    -->
    <script src="/about-data.js" defer></script>
    <script src="/about.js" defer></script>
    <!--
      Support footer. Vendored from stoatworks-backend/support-footer — edit it
      there and re-run scripts/sync-support-footer.sh, never here.
      Classic + defer on purpose: it reads its config off this tag, and
      document.currentScript is null inside a module.
    -->
    <script
      src="/support-footer.js"
      defer
      data-app="Line Calc"
      data-repo="https://github.com/stoatworks-labs/line-calc"
      data-note="It runs entirely in your browser — no account, and nothing you type is uploaded."
    ></script>
  </body>
</html>
