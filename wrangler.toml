# Cloudflare deployment for Line Calc.
#
# A static-assets-only Worker: no server code, nothing to run on the edge. Like
# Blend Calc and unlike the recorded demos in the fleet, this one IS built by
# Cloudflare — it is plain Vite and it is the real tool rather than a capture, so
# `dist/` stays out of git. Set the build command in the Cloudflare project to:
#
#   npm ci && npm run build
#
# Without this file, `wrangler deploy` looks for a static directory at the repo root,
# finds none (the build output is under dist/) and fails with "Could not detect a
# directory containing static files".
#
# `public/_headers` is copied into dist/ by Vite and carries the CSP and the
# immutable-cache rule for hashed assets; the assets runtime honours it.
#
# `name` must match the Cloudflare project.

name = "line-calc"
compatibility_date = "2026-09-21"

[assets]
directory = "./dist"

# The custom domain is declared here rather than clicked into the dashboard, so the
# routing is in the repo and a fresh deploy reproduces it. Same shape as
# negative-space, arraycad and simple-rta.
#
# Note this silently disables the workers.dev URL — wrangler defaults `workers_dev`
# to false once routes exist — so *.workers.dev links to this app 404 from the first
# deploy that carries this block.
[[routes]]
pattern = "line-calc.stoatworks-labs.com"
custom_domain = true
